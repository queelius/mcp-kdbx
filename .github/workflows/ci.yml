name: CI

on:
  push:
    branches: [main, "feat/**", "adopt/**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: build, test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - name: Check out mcp-kdbx
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Build
        run: cargo build --all-features --verbose
      # --all-features turns on `cli`, so clippy also lints the gen-fixtures
      # helper binary.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features --verbose

  protocol-conformance:
    name: protocol conformance
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - name: Check out mcp-kdbx
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: Run the protocol-conformance suite against the real binary
        run: cargo test --test protocol_conformance --verbose

  audit:
    name: source security audit
    runs-on: ubuntu-latest
    steps:
      # The audit is a source grep; it needs no build.
      - name: Check out mcp-kdbx
        uses: actions/checkout@v5
      - name: Run the source security audit
        run: bash scripts/ci-audit.sh
