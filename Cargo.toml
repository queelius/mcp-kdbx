[package]
name = "mcp-kdbx"
description = "Model Context Protocol server exposing KeePass KDBX vaults to AI agents (bridge member of the *-kdbx ecosystem)"
version = "0.1.0"
edition = "2024"
# 1.89: std::fs::File::try_lock, the advisory writer lock the save path holds
# across its conflict check and rename (no extra dependency needed).
rust-version = "1.89"
authors = ["Alexander Towell <lex@metafunctor.com>"]
license = "MIT"
repository = "https://github.com/queelius/mcp-kdbx"
readme = "README.md"
keywords = ["keepass", "kdbx", "mcp", "credentials", "agent"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
# Substrate: the only maintained Rust KDBX library. 0.12.9 is the floor
# kdbx-core's keepass-0_12 adapter needs (it also carries
# EntryRef::attachments_named(), upstream PR #321). save_kdbx4 enables the
# write path (Database::save).
keepass = { version = "0.12.9", features = ["serialization", "save_kdbx4"] }
# The ecosystem's shared vault model and rules (path grammar, visibility,
# field schema, keyed fingerprints, TOTP). keepass-0_12 adds snapshot capture
# from this crate's keepass version; the default `kdf` feature adds the
# Argon2id-derived fingerprint key the audit log uses. When mcp-kdbx bumps
# keepass, it switches this feature, not diff-kdbx.
kdbx-core = { version = "0.1.0", features = ["keepass-0_12"] }
# Sibling ecosystem member, used as a library (no `cli`) for the semantic
# stage diff (kdbx_diff_pending). Its API is a pure function of two kdbx-core
# snapshots and names no keepass type, so it no longer constrains this crate's
# keepass version.
diff-kdbx = "0.1.0"
# The OS random number generator, for the one-off fingerprint key each stage
# diff uses (already in the tree through uuid).
getrandom = "0.4"
# Async runtime: tokio drives the unlock-command shell-out (timeout-bounded),
# the idle timer (Phase 2), and the stdio transport (Phase 3).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Unicode NFC normalization for case-sensitive, normalization-aware path name
# comparison. Small, single-purpose crate.
unicode-normalization = "0.1"
# Unicode General_Category lookup (same unicode-rs family as
# unicode-normalization). Titles and field names refuse control (Cc) and
# format (Cf) characters, minus an explicit allow-list (ZWNJ, ZWJ); std only
# exposes Cc (char::is_control), and an allow-list over Cf needs the category.
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
zeroize = "1"
thiserror = "2"
anyhow = "1.0.103"
# Audit log emission.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rmcp = { version = "1.7.0", features = ["server", "macros", "transport-io"] }
# JSON Schema derive for core input enums (search::Field), so a tool schema can
# enumerate allowed values. The same major version rmcp uses, so it unifies with
# rmcp's copy; it is a JSON Schema crate, not an MCP type, so engine may use
# it without breaking the core/adapter split.
schemars = "1"

# O_NOFOLLOW / O_NONBLOCK / ELOOP for opening the sidecar writer-lock file
# safely (engine::vault_file). Already in the tree through tokio.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Gates the gen-fixtures helper binary (added in Phase 4). Matches the
# diff-kdbx / web-kdbx convention of a `cli`-gated fixture generator.
cli = ["dep:clap"]

# The gen-fixtures helper builds the committed test vaults under tests/fixtures/.
# Gated by the `cli` feature so a default build stays lean and the generator is
# not part of the shipped server. Regenerate with:
#   cargo run --features cli --bin gen-fixtures
[[bin]]
name = "gen-fixtures"
path = "src/bin/gen_fixtures.rs"
required-features = ["cli"]

[dependencies.clap]
version = "4"
features = ["derive"]
optional = true

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

# Each unlock derives the audit fingerprint key with Argon2id (at least
# 64 MiB x 3 passes), and the test suites unlock many vaults. Unoptimized,
# that derivation takes seconds; optimize the KDF crates even in dev builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
