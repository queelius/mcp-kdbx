[package]
name = "mcp-kdbx"
description = "Model Context Protocol server exposing KeePass KDBX vaults to AI agents (bridge member of the *-kdbx ecosystem)"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Alexander Towell <lex@metafunctor.com>"]
license = "MIT"
repository = "https://github.com/queelius/mcp-kdbx"
readme = "README.md"
keywords = ["keepass", "kdbx", "mcp", "credentials", "agent"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
# Substrate: the only maintained Rust KDBX library. 0.12.5 is the floor that
# carries EntryRef::attachments_named() (upstream PR #321). save_kdbx4 enables
# the write path (Database::save).
keepass = { version = "0.12.5", features = ["serialization", "save_kdbx4"] }
# Sibling ecosystem member, used as a library for the semantic stage diff
# (kdbx_diff_pending). Path dependency for local development; publishing v0.1
# needs diff-kdbx on crates.io or a git URL. diff_kdbx::compute::compute takes
# two keepass::Database values and is I/O-free, so it composes cleanly here.
diff-kdbx = { path = "../diff-kdbx" }
# Async runtime: tokio drives the unlock-command shell-out (timeout-bounded),
# the idle timer (Phase 2), and the stdio transport (Phase 3).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Unicode NFC normalization for case-sensitive, normalization-aware path name
# comparison. Small, single-purpose crate.
unicode-normalization = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
zeroize = "1"
# TOTP: matches the web-kdbx stack so otpauth handling stays consistent.
totp-lite = "2"
base32 = "0.5"
url = "2"
thiserror = "2"
anyhow = "1"
# Audit log emission.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[features]
# Gates the gen-fixtures helper binary (added in Phase 4). Matches the
# diff-kdbx / web-kdbx convention of a `cli`-gated fixture generator.
cli = ["dep:clap"]

[dependencies.clap]
version = "4"
features = ["derive"]
optional = true

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
